name: Auto-walk integration

on:
  push:
    branches: [feature/shortest-path-autowalk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and check auto-walk
        run: ./gradlew :client:compileJava :client:compileTestJava :client:checkstyleMain :client:checkstyleTest :client:pmdMain :client:test --tests 'net.runelite.client.plugins.autowalk.*' --tests 'net.runelite.client.plugins.shortestpath.*' --tests 'net.runelite.client.plugins.PluginManagerTest' --stacktrace
      - name: Show plugin loading failure
        if: failure()
        run: cat runelite-client/build/test-results/test/TEST-net.runelite.client.plugins.PluginManagerTest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-walk-verification
          path: |
            runelite-client/build/reports/
            runelite-client/build/test-results/
